name: build-release-wheel
run-name: c2pa-python ${{ inputs.release_version }} ${{ inputs.release_build_id || '' }}

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "c2pa-python release version, for example 0.31.0+stardustproof.1"
        required: true
        type: string
      release_tag:
        description: "GitHub release tag to create or update; defaults to v<release_version>"
        required: false
        type: string
      release_build_id:
        description: "Optional central release workflow correlation id"
        required: false
        type: string
      build_windows_wheel:
        description: "Also build and publish a windows-x86_64 wheel bundle"
        required: false
        default: "false"
        type: string
      allow_unprotected_ref:
        description: "Allow building from a non-default, unprotected ref. Use only for forked dependency release branches."
        required: false
        default: "false"
        type: string

permissions:
  contents: write

concurrency:
  group: release-wheel-${{ inputs.release_version }}
  cancel-in-progress: false

env:
  MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64:latest
  MANYLINUX_PYTHON: /opt/python/cp311-cp311/bin/python
  RUST_TOOLCHAIN: "1.88.0"
  WHEEL_PLAT_NAME: manylinux_2_28_x86_64
  WHEEL_PLAT_NAME_WINDOWS: win_amd64
  PYTHON_VERSION_WINDOWS: "3.11"

jobs:
  build-wheel:
    name: Build and publish release wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      NATIVE_TRIPLE: x86_64-unknown-linux-gnu
    outputs:
      release_version: ${{ steps.inputs.outputs.release_version }}
      release_tag: ${{ steps.inputs.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate release inputs
        id: inputs
        env:
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag || '' }}
          INPUT_ALLOW_UNPROTECTED_REF: ${{ inputs.allow_unprotected_ref || 'false' }}
          REF_PROTECTED: ${{ github.ref_protected }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$REF_PROTECTED" != "true" ] && [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ] && [ "$INPUT_ALLOW_UNPROTECTED_REF" != "true" ]; then
            echo "::error::Release wheel builds are allowed only from protected refs or the default branch"
            exit 1
          fi
          release_version="${INPUT_RELEASE_VERSION#v}"
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+stardustproof\.[0-9]+$ ]]; then
            echo "::error::release_version must match MAJOR.MINOR.PATCH+stardustproof.N, got: $release_version"
            exit 1
          fi
          pyproject_version="$(python3 - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          if [ "$pyproject_version" != "$release_version" ]; then
            echo "::error::pyproject.toml version $pyproject_version does not match release_version $release_version"
            exit 1
          fi
          release_tag="${INPUT_RELEASE_TAG:-v${release_version}}"
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\+stardustproof\.[0-9]+$ ]]; then
            echo "::error::release_tag must match vMAJOR.MINOR.PATCH+stardustproof.N, got: $release_tag"
            exit 1
          fi
          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Download and verify the native library
        id: native
        env:
          # download_artifacts.py sends this as an Authorization header when
          # set; unauthenticated release lookups share the runner's IP rate
          # limit and can 403 in the middle of a release.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # setup.py copies a prebuilt library out of artifacts/<triple> and
          # raises if it is absent; nothing here built or fetched one. Same
          # download build-wheel.yml performs. $PWD is bind-mounted into the
          # container below, so this can run on the host.
          tag="$(tr -d '[:space:]' < c2pa-native-version.txt)"
          [ -n "$tag" ] || { echo "::error::c2pa-native-version.txt is empty"; exit 1; }
          echo "native_tag=${tag}" >> "$GITHUB_OUTPUT"

          mkdir -p artifacts src/c2pa/libs
          python3 -m pip install --upgrade pip
          # requests is declared in requirements-dev.txt, not requirements.txt,
          # and download_artifacts.py imports it.
          python3 -m pip install -r requirements.txt -r requirements-dev.txt
          C2PA_LIBS_PLATFORM="$NATIVE_TRIPLE" python3 scripts/download_artifacts.py "$tag"

          lib="artifacts/$NATIVE_TRIPLE/libc2pa_c.so"
          if [ ! -s "$lib" ]; then
            echo "::error::$lib missing after downloading $tag -- the release asset layout changed"
            exit 1
          fi
          sha="$(sha256sum "$lib" | cut -d' ' -f1)"
          echo "native_lib_sha256=${sha}" >> "$GITHUB_OUTPUT"

          # setup.py's copy_platform_libraries() globs the whole platform
          # directory into the wheel, and the release asset carries link-time
          # and debug files nothing loads at runtime (c2pa_c.lib alone is 245 MB, plus a 7.8 MB .pdb).
          # The published v0.31.0+stardustproof.1 wheel contains only the
          # runtime library, so keep that shape.
          find "artifacts/$NATIVE_TRIPLE" -type f ! -name 'c2pa_c.dll' -print -delete
          echo "downloaded $tag -> $lib ($sha)"

      - name: Build wheel in manylinux container
        run: |
          set -euo pipefail
          fix_permissions() {
            for path in build dist src/c2pa/libs c2pa-rs/target wheelhouse src/*.egg-info *.egg-info; do
              if [ -e "$path" ]; then
                sudo chown -R "$(id -u):$(id -g)" "$path"
              fi
            done
          }
          trap fix_permissions EXIT
          rm -rf build dist src/c2pa/libs
          docker pull "$MANYLINUX_IMAGE"
          manylinux_image_ref="$(docker image inspect "$MANYLINUX_IMAGE" --format '{{index .RepoDigests 0}}')"
          if [ -z "$manylinux_image_ref" ]; then
            echo "::error::Could not resolve manylinux image digest for $MANYLINUX_IMAGE"
            exit 1
          fi
          echo "MANYLINUX_IMAGE_REF=${manylinux_image_ref}" >> "$GITHUB_ENV"
          docker run --rm \
            -e C2PA_CARGO_BUILD_TIMEOUT_SECONDS=1800 \
            -e MANYLINUX_PYTHON="$MANYLINUX_PYTHON" \
            -e RUST_TOOLCHAIN="$RUST_TOOLCHAIN" \
            -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -e WHEEL_PLAT_NAME="$WHEEL_PLAT_NAME" \
            -v "$PWD:/io" \
            -w /io \
            "$manylinux_image_ref" \
            /bin/bash -lc 'set -euo pipefail; if command -v dnf >/dev/null 2>&1; then dnf -y install perl-IPC-Cmd perl-Time-Piece; else yum -y install perl-IPC-Cmd perl-Time-Piece; fi; curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"; export PATH="$HOME/.cargo/bin:$PATH"; "$MANYLINUX_PYTHON" -m pip install --upgrade pip; "$MANYLINUX_PYTHON" -m pip install "wheel==0.45.1" "setuptools==80.9.0" "toml==0.10.2"; "$MANYLINUX_PYTHON" setup.py bdist_wheel --plat-name "$WHEEL_PLAT_NAME"; mkdir -p wheelhouse; auditwheel repair --plat "$WHEEL_PLAT_NAME" -w wheelhouse dist/*.whl; rm -f dist/*.whl; mv wheelhouse/*.whl dist/; auditwheel show dist/*.whl | tee dist/auditwheel-show.txt; "$MANYLINUX_PYTHON" -m venv /tmp/c2pa-wheel-smoke; /tmp/c2pa-wheel-smoke/bin/pip install dist/*.whl; /tmp/c2pa-wheel-smoke/bin/python -c "import c2pa; print(c2pa.__file__)" | tee dist/import-smoke.txt'
          ls -l dist

      - name: Validate wheel and write evidence
        id: evidence
        env:
          RELEASE_VERSION: ${{ steps.inputs.outputs.release_version }}
          RELEASE_TAG: ${{ steps.inputs.outputs.release_tag }}
          NATIVE_TAG: ${{ steps.native.outputs.native_tag }}
          NATIVE_LIB_SHA256: ${{ steps.native.outputs.native_lib_sha256 }}
        run: |
          set -euo pipefail
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name '*.whl' | sort)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one wheel in dist/, got ${#wheels[@]}"
            exit 1
          fi
          wheel_path="${wheels[0]}"
          wheel_name="$(basename "$wheel_path")"
          wheel_sha256="$(sha256sum "$wheel_path" | cut -d' ' -f1)"
          printf '%s  %s\n' "$wheel_sha256" "$wheel_name" | tee "dist/${wheel_name}.sha256"
          safe_release_version="${RELEASE_VERSION//+/-}"
          bundle_name="c2pa-python-${safe_release_version}-wheel-bundle.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf - \
            -C dist "$wheel_name" "${wheel_name}.sha256" auditwheel-show.txt import-smoke.txt \
            | gzip -n > "dist/${bundle_name}"
          bundle_sha256="$(sha256sum "dist/${bundle_name}" | cut -d' ' -f1)"
          printf '%s  %s\n' "$bundle_sha256" "$bundle_name" | tee "dist/${bundle_name}.sha256"
          # Conditional: there is no c2pa-rs checkout on this branch, but there
          # is on the submodule lineage, and consumers read these fields.
          # -e c2pa-rs/.git, not -d c2pa-rs: for an empty directory git walks
          # up and rev-parse returns this repository's own HEAD, which would be
          # recorded as the c2pa-rs commit.
          if [ -e c2pa-rs/.git ]; then
            c2pa_rs_commit="$(git -C c2pa-rs rev-parse HEAD)"
            c2pa_rs_status="$(git submodule status --recursive c2pa-rs || true)"
          else
            c2pa_rs_commit=""
            c2pa_rs_status=""
          fi
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python_version="$(docker run --rm "$MANYLINUX_IMAGE_REF" "$MANYLINUX_PYTHON" -VV)"
          export wheel_name wheel_sha256 bundle_name bundle_sha256 c2pa_rs_commit c2pa_rs_status generated_at python_version
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "artifact_type": "c2pa_python_release_wheel_evidence",
              "package_name": "c2pa-python",
              "release_version": os.environ["RELEASE_VERSION"],
              "release_tag": os.environ["RELEASE_TAG"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}",
              "source_ref": os.environ["GITHUB_REF_NAME"],
              "source_sha": os.environ["GITHUB_SHA"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_number": os.environ["GITHUB_RUN_NUMBER"],
              "generated_at": os.environ["generated_at"],
              "runner_os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"],
              "python_version": os.environ["python_version"],
              "rust_toolchain": os.environ["RUST_TOOLCHAIN"],
              "manylinux_image": os.environ["MANYLINUX_IMAGE"],
              "manylinux_image_ref": os.environ["MANYLINUX_IMAGE_REF"],
              "wheel_plat_name": os.environ["WHEEL_PLAT_NAME"],
              "c2pa_native_source_repository": "contentauth/c2pa-rs",
              "c2pa_native_release_tag": os.environ["NATIVE_TAG"],
              "c2pa_native_library_file": "libc2pa_c.so",
              "c2pa_native_library_sha256": os.environ["NATIVE_LIB_SHA256"],
              "c2pa_native_triple": os.environ["NATIVE_TRIPLE"],
              "wheel_file": os.environ["wheel_name"],
              "wheel_sha256": os.environ["wheel_sha256"],
              "wheel_bundle_file": os.environ["bundle_name"],
              "wheel_bundle_sha256": os.environ["bundle_sha256"],
          }
          for key, env_name in (("c2pa_rs_submodule_commit", "c2pa_rs_commit"),
                                ("c2pa_rs_submodule_status", "c2pa_rs_status")):
              if os.environ.get(env_name):
                  evidence[key] = os.environ[env_name]

          Path("dist/c2pa-python-wheel-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          echo "wheel_path=${wheel_path}" >> "$GITHUB_OUTPUT"
          echo "wheel_name=${wheel_name}" >> "$GITHUB_OUTPUT"
          echo "wheel_sha256=${wheel_sha256}" >> "$GITHUB_OUTPUT"
          echo "bundle_name=${bundle_name}" >> "$GITHUB_OUTPUT"
          echo "bundle_sha256=${bundle_sha256}" >> "$GITHUB_OUTPUT"

      - name: Upload wheel evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c2pa-python-release-wheel
          path: |
            dist/c2pa-python-*-wheel-bundle.tar.gz
            dist/c2pa-python-*-wheel-bundle.tar.gz.sha256
            dist/c2pa-python-wheel-evidence.json
            dist/auditwheel-show.txt
            dist/import-smoke.txt

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.inputs.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.inputs.outputs.release_version }}
          NATIVE_TAG: ${{ steps.native.outputs.native_tag }}
        run: |
          set -euo pipefail
          notes_file="dist/release-notes.md"
          # Resolved before the heredoc: a failing $( ) inside one does not
          # abort under `set -e`, it just publishes an empty line -- and there
          # is no c2pa-rs checkout on this branch.
          if [ -e c2pa-rs/.git ]; then
            native_source="c2pa-rs submodule: $(git -C c2pa-rs rev-parse HEAD)"
          else
            native_source="c2pa-rs native library: ${NATIVE_TAG} (contentauth/c2pa-rs)"
          fi
          cat > "$notes_file" <<EOF
          c2pa-python ${RELEASE_VERSION} StardustProof fork wheel.

          Source commit: ${GITHUB_SHA}
          ${native_source}
          Wheel SHA-256: ${{ steps.evidence.outputs.wheel_sha256 }}
          Bundle SHA-256: ${{ steps.evidence.outputs.bundle_sha256 }}
          GitHub Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "::error::Release tag $RELEASE_TAG points to $tag_commit, not $GITHUB_SHA"
              exit 1
            fi
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/c2pa-python-*-wheel-bundle.tar.gz \
              dist/c2pa-python-*-wheel-bundle.tar.gz.sha256 \
              dist/c2pa-python-wheel-evidence.json \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/c2pa-python-*-wheel-bundle.tar.gz \
              dist/c2pa-python-*-wheel-bundle.tar.gz.sha256 \
              dist/c2pa-python-wheel-evidence.json \
              --title "$RELEASE_TAG" \
              --notes-file "$notes_file" \
              --target "$GITHUB_SHA"
          fi

  # windows-x86_64 leg. Opt-in via build_windows_wheel so a Linux-only release
  # runs exactly as before, and `needs: build-wheel` so it reuses the validated
  # version/tag and uploads into a release that already exists.
  #
  # Runs under bash throughout: Git Bash on windows-latest provides GNU tar
  # (--sort/--mtime/--numeric-owner), gzip -n and sha256sum, so the bundle is
  # packed with the same flags as the manylinux leg and stays reproducible.
  build-wheel-windows:
    name: Build and publish release wheel (windows-x86_64)
    needs: build-wheel
    if: inputs.build_windows_wheel == 'true'
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    env:
      NATIVE_TRIPLE: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION_WINDOWS }}

      - name: Download and verify the native library
        id: native
        env:
          # download_artifacts.py sends this as an Authorization header when
          # set; unauthenticated release lookups share the runner's IP rate
          # limit and can 403 in the middle of a release.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # setup.py does not build anything -- copy_platform_libraries() lifts a
          # prebuilt library out of artifacts/<triple> and raises if it is not
          # there. This is the same download build-wheel.yml performs, with the
          # version taken from the in-repo pin rather than restated here.
          tag="$(tr -d '[:space:]' < c2pa-native-version.txt)"
          [ -n "$tag" ] || { echo "::error::c2pa-native-version.txt is empty"; exit 1; }
          echo "native_tag=${tag}" >> "$GITHUB_OUTPUT"

          mkdir -p artifacts src/c2pa/libs
          python -m pip install --upgrade pip
          # requests is declared in requirements-dev.txt, not requirements.txt,
          # and download_artifacts.py imports it.
          python -m pip install -r requirements.txt -r requirements-dev.txt
          C2PA_LIBS_PLATFORM="$NATIVE_TRIPLE" python scripts/download_artifacts.py "$tag"

          lib="artifacts/$NATIVE_TRIPLE/c2pa_c.dll"
          if [ ! -s "$lib" ]; then
            echo "::error::$lib missing after downloading $tag -- the release asset layout changed"
            exit 1
          fi
          sha="$(sha256sum "$lib" | cut -d' ' -f1)"
          echo "native_lib_sha256=${sha}" >> "$GITHUB_OUTPUT"

          # setup.py's copy_platform_libraries() globs the whole platform
          # directory into the wheel, and the release asset carries link-time
          # and debug files nothing loads at runtime (libc2pa_c.rlib alone is 26 MB).
          # The published v0.31.0+stardustproof.1 wheel contains only the
          # runtime library, so keep that shape.
          find "artifacts/$NATIVE_TRIPLE" -type f ! -name 'libc2pa_c.so' -print -delete
          echo "downloaded $tag -> $lib ($sha)"

      - name: Build wheel
        run: |
          set -euo pipefail
          # SOURCE_DATE_EPOCH, as the manylinux leg sets: without it the wheel's
          # ZIP timestamps come from the clock and the bundle digest is not
          # reproducible for identical inputs.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m pip install "wheel==0.45.1" "setuptools==80.9.0" "toml==0.10.2"
          python setup.py bdist_wheel --plat-name "$WHEEL_PLAT_NAME_WINDOWS"

          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name '*.whl' | sort)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one wheel in dist/, got ${#wheels[@]}"
            exit 1
          fi

          # There is no auditwheel equivalent on Windows, so record the wheel's
          # contents instead: the native c2pa_c.dll has to be inside it, or the
          # wheel imports only on a machine that happens to have one.
          python - "${wheels[0]}" > dist/wheel-contents.txt <<'PY'
          import sys
          import zipfile

          names = sorted(zipfile.ZipFile(sys.argv[1]).namelist())
          print("\n".join(names))
          if not any(name.endswith("c2pa_c.dll") for name in names):
              raise SystemExit("wheel does not contain c2pa_c.dll")
          PY

          python -m venv "$RUNNER_TEMP/c2pa-wheel-smoke"
          "$RUNNER_TEMP/c2pa-wheel-smoke/Scripts/python.exe" -m pip install "${wheels[0]}"
          "$RUNNER_TEMP/c2pa-wheel-smoke/Scripts/python.exe" -c "import c2pa; print(c2pa.__file__)" \
            | tee dist/import-smoke.txt

      - name: Validate wheel and write evidence
        id: evidence
        env:
          RELEASE_VERSION: ${{ needs.build-wheel.outputs.release_version }}
          RELEASE_TAG: ${{ needs.build-wheel.outputs.release_tag }}
          NATIVE_TAG: ${{ steps.native.outputs.native_tag }}
          NATIVE_LIB_SHA256: ${{ steps.native.outputs.native_lib_sha256 }}
        run: |
          set -euo pipefail
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name '*.whl' | sort)
          wheel_path="${wheels[0]}"
          wheel_name="$(basename "$wheel_path")"
          if [[ "$wheel_name" != *"$WHEEL_PLAT_NAME_WINDOWS"* ]]; then
            echo "::error::Expected a $WHEEL_PLAT_NAME_WINDOWS wheel, got $wheel_name"
            exit 1
          fi
          wheel_sha256="$(sha256sum "$wheel_path" | cut -d' ' -f1)"
          printf '%s  %s\n' "$wheel_sha256" "$wheel_name" | tee "dist/${wheel_name}.sha256"
          safe_release_version="${RELEASE_VERSION//+/-}"
          bundle_name="c2pa-python-${safe_release_version}-wheel-bundle-windows-x86_64.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf - \
            -C dist "$wheel_name" "${wheel_name}.sha256" wheel-contents.txt import-smoke.txt \
            | gzip -n > "dist/${bundle_name}"
          bundle_sha256="$(sha256sum "dist/${bundle_name}" | cut -d' ' -f1)"
          printf '%s  %s\n' "$bundle_sha256" "$bundle_name" | tee "dist/${bundle_name}.sha256"
          # There is no c2pa-rs checkout on this branch and no .gitmodules entry:
          # the native library is a *release artifact*, so provenance is the
          # release it came from and the digest of the library itself. Kept
          # conditional because a checkout does exist on the submodule lineage,
          # and consumers of the existing schema read c2pa_rs_submodule_commit.
          # -e c2pa-rs/.git, not -d c2pa-rs: for an empty directory git walks
          # up and rev-parse returns this repository's own HEAD, which would be
          # recorded as the c2pa-rs commit.
          if [ -e c2pa-rs/.git ]; then
            c2pa_rs_commit="$(git -C c2pa-rs rev-parse HEAD)"
            c2pa_rs_status="$(git submodule status --recursive c2pa-rs || true)"
          else
            c2pa_rs_commit=""
            c2pa_rs_status=""
          fi
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python_version="$(python -VV)"
          export wheel_name wheel_sha256 bundle_name bundle_sha256 c2pa_rs_commit c2pa_rs_status generated_at python_version
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "artifact_type": "c2pa_python_release_wheel_evidence",
              "package_name": "c2pa-python",
              "platform": "windows-x86_64",
              "release_version": os.environ["RELEASE_VERSION"],
              "release_tag": os.environ["RELEASE_TAG"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}",
              "source_ref": os.environ["GITHUB_REF_NAME"],
              "source_sha": os.environ["GITHUB_SHA"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_number": os.environ["GITHUB_RUN_NUMBER"],
              "generated_at": os.environ["generated_at"],
              "runner_os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"],
              "python_version": os.environ["python_version"],
              "wheel_plat_name": os.environ["WHEEL_PLAT_NAME_WINDOWS"],
              # Where the prebuilt native library came from, and its digest, so
              # the wheel's contents can be traced without a source checkout.
              "c2pa_native_source_repository": "contentauth/c2pa-rs",
              "c2pa_native_release_tag": os.environ["NATIVE_TAG"],
              "c2pa_native_library_file": "c2pa_c.dll",
              "c2pa_native_library_sha256": os.environ["NATIVE_LIB_SHA256"],
              "c2pa_native_triple": os.environ["NATIVE_TRIPLE"],
              "wheel_file": os.environ["wheel_name"],
              "wheel_sha256": os.environ["wheel_sha256"],
              "wheel_bundle_file": os.environ["bundle_name"],
              "wheel_bundle_sha256": os.environ["bundle_sha256"],
          }
          # Present only on the submodule lineage; omitted rather than recorded
          # as an empty string, so a consumer can tell "not applicable" from
          # "unknown".
          for key, env_name in (("c2pa_rs_submodule_commit", "c2pa_rs_commit"),
                                ("c2pa_rs_submodule_status", "c2pa_rs_status")):
              if os.environ.get(env_name):
                  evidence[key] = os.environ[env_name]

          Path("dist/c2pa-python-wheel-evidence-windows-x86_64.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          echo "wheel_sha256=${wheel_sha256}" >> "$GITHUB_OUTPUT"
          echo "bundle_name=${bundle_name}" >> "$GITHUB_OUTPUT"
          echo "bundle_sha256=${bundle_sha256}" >> "$GITHUB_OUTPUT"

      - name: Upload wheel evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c2pa-python-release-wheel-windows
          path: |
            dist/c2pa-python-*-wheel-bundle-windows-x86_64.tar.gz
            dist/c2pa-python-*-wheel-bundle-windows-x86_64.tar.gz.sha256
            dist/c2pa-python-wheel-evidence-windows-x86_64.json
            dist/wheel-contents.txt
            dist/import-smoke.txt

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-wheel.outputs.release_tag }}
        run: |
          set -euo pipefail
          # build-wheel has already created the release for this tag.
          gh release upload "$RELEASE_TAG" \
            dist/c2pa-python-*-wheel-bundle-windows-x86_64.tar.gz \
            dist/c2pa-python-*-wheel-bundle-windows-x86_64.tar.gz.sha256 \
            dist/c2pa-python-wheel-evidence-windows-x86_64.json \
            --clobber
